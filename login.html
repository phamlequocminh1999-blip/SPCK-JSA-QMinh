<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài Khoản - Quoc Minh Computer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header text-white py-3">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
            <a href="index.html" class="text-decoration-none brand-logo">
                <h1 class="h4 mb-0 text-danger fw-bold">QUOC MINH COMPUTER</h1>
            </a>

            <nav class="nav-menu d-flex align-items-center flex-wrap gap-1">
                <a href="index.html" class="nav-link-item text-white text-decoration-none px-3 py-1">Trang Chủ</a>
                <a href="linhkien.html" class="nav-link-item text-white text-decoration-none px-3 py-1">Linh Kiện PC</a>
                <a href="pcbuildsan.html" class="nav-link-item text-white text-decoration-none px-3 py-1">PC Build Sẵn</a>
                <a href="lienhe.html" class="nav-link-item text-white text-decoration-none px-3 py-1">Liên Hệ</a>

                <button type="button" id="openCartBtn" class="btn btn-light btn-sm ms-2 px-3 fw-bold position-relative">
                    Giỏ Hàng
                    <span class="badge bg-danger ms-1 cart-count-badge" style="display: none;">0</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="container my-5 d-flex justify-content-center align-items-center">
        <div class="card auth-card border-0 overflow-hidden" style="max-width: 460px; width: 100%;">
            <div class="card-header bg-dark text-white p-0 border-0">
                <ul class="nav nav-pills nav-fill" id="authTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active rounded-0 py-3 fw-bold text-uppercase text-white" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginPane" type="button" role="tab">
                            Đăng Nhập
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link rounded-0 py-3 fw-bold text-uppercase text-white" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerPane" type="button" role="tab">
                            Đăng Ký
                        </button>
                    </li>
                </ul>
            </div>

            <div class="card-body p-4 p-md-5 tab-content">
                <!-- Tab Đăng Nhập -->
                <div class="tab-pane fade show active" id="loginPane" role="tabpanel">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label fw-bold">Email của bạn</label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="nhapemail@vidu.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label fw-bold">Mật khẩu</label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="********" required>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label small" for="remember">Ghi nhớ đăng nhập</label>
                            </div>
                            <a href="lienhe.html" class="text-danger text-decoration-none small">Cần hỗ trợ?</a>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 py-2 fw-bold text-uppercase">Đăng Nhập</button>
                    </form>
                </div>

                <!-- Tab Đăng Ký -->
                <div class="tab-pane fade" id="registerPane" role="tabpanel">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="regName" class="form-label fw-bold">Tên hiển thị</label>
                            <input type="text" class="form-control" id="regName" placeholder="Ví dụ: Quốc Minh" required>
                        </div>
                        <div class="mb-3">
                            <label for="regEmail" class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="nhapemail@vidu.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="regPassword" class="form-label fw-bold">Mật khẩu</label>
                            <input type="password" class="form-control" id="regPassword" placeholder="Tối thiểu 6 ký tự" minlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 py-2 fw-bold text-uppercase">Tạo Tài Khoản</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-1 fw-bold text-danger">QUOC MINH COMPUTER</p>
            <p class="mb-0 small text-secondary">© 2026 Quoc Minh Computer - Quận 10, TP. Hồ Chí Minh. Tất cả các quyền được bảo lưu.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
